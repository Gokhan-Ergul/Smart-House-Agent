<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Home Dashboard</title>
    <style>
        body { 
            background-color: #1a1a1a; 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            padding: 40px; 
            margin: 0;
        }
        h1 { margin-bottom: 40px; font-weight: 300; letter-spacing: 2px; }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); 
            gap: 25px; 
            max-width: 1000px; 
            margin: 0 auto; 
        }
        .card { 
            background: #2d2d2d; 
            padding: 25px; 
            border-radius: 15px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.2s, background-color 0.3s; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .card:hover { transform: translateY(-5px); background: #333; }
        .icon { font-size: 50px; margin-bottom: 15px; display: block; }
        h3 { margin: 10px 0 5px 0; font-size: 16px; color: #aaa; }
        p { font-size: 18px; margin: 0; font-weight: bold; }
        .status-on, .status-open, .status-unlocked, .status-unlock { 
            color: #4caf50; 
            text-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
        } 
        .status-off, .status-closed, .status-locked, .status-lock { 
            color: #f44336; 
        } 
        .status-on { 
            color: #4caf50;
            text-shadow: 0 0 10px #4caf50; 
        }
        .status-off {
            color: #757575;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #00e5ff;
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <a href="#" onclick="window.close(); return false;" class="back-link">← Close Dashboard</a>
    <h1>🏠 Agent Control Center</h1>
    <div id="dashboard" class="grid">Loading devices...</div>
    <script>
        const icons = { 
            "light": "💡", "tv": "📺", "curtain": "🪟", 
            "door_lock": "🔒", "thermostat_mode": "🌡️", "main_water_valve": "🚰" 
        };
        async function update() {
            try {
                const res = await fetch('/status'); 
                const data = await res.json();
                const board = document.getElementById('dashboard');
                board.innerHTML = '';
                for (const [device, state] of Object.entries(data)) {
                    let statusClass = "status-off";
                    let displayState = state.toUpperCase();
                    let icon = icons[device] || '❓';
                    if (state.startsWith("set_mode_")) {
                        statusClass = `status-${state}`; 
                        displayState = state.replace("set_mode_", "").toUpperCase();
                    } else {
                        const positive = ['on', 'open', 'unlocked', 'unlock', 'auto'];
                        statusClass = positive.includes(state.toLowerCase()) ? "status-on" : "status-off";
                    }
                    board.innerHTML += `
                        <div class="card">
                            <span class="icon">${icon}</span>
                            <h3>${device.toUpperCase().replace(/_/g, ' ')}</h3>
                            <p class="${statusClass}">${displayState}</p>
                        </div>`;
                }
            } catch (e) { console.error("Connection error:", e); }
        }
        setInterval(update, 1000);
        update();
    </script>
</body>
</html>
