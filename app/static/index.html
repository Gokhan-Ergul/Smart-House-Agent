<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Smart House AI Agent — control your home devices with natural language">
    <title>Smart House Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <header>
        <a href="/dashboard" class="dashboard-link" target="_blank">⊞ Device Dashboard</a>
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme" title="Toggle dark/light mode">☀️</button>
    </header>

    <main>
        <!-- Glowing Orb Avatar -->
        <div class="orb-container">
            <div class="orb" id="orb" aria-hidden="true"></div>
        </div>

        <!-- Chat Messages -->
        <div class="chat-container" id="chat-container" role="log" aria-live="polite">
            <!-- Welcome message -->
            <div class="message agent">
                <div class="msg-content">Hello! I'm your Smart Home Agent. Tell me what you'd like to do — control lights, TV, curtains, door lock, thermostat, or water valve.</div>
                <div class="msg-meta" id="welcome-msg-meta">AGENT &bull; </div>
            </div>
        </div>

        <!-- Typing Indicator -->
        <div class="typing-indicator" id="typing-indicator" aria-label="Agent is thinking">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>

        <!-- Input Bar -->
        <div class="input-area">
            <div class="input-container">
                <span aria-hidden="true" style="font-size:1.2rem; margin-right:4px; opacity:0.6;">🎤</span>
                <input
                    type="text"
                    id="msg-input"
                    placeholder="Command your space..."
                    autocomplete="off"
                    aria-label="Message input"
                />
                <button id="send-btn" class="send-btn" aria-label="Send message">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M15.854.146a.5.5 0 0 1 .11.54l-5.819 14.547a.75.75 0 0 1-1.329.124l-3.178-4.995L.643 7.184a.75.75 0 0 1 .124-1.33L15.314.037a.5.5 0 0 1 .54.11ZM6.717 7.3l3.05 4.793L13.5 2.205 6.717 7.3Zm7.199-5.083L1.162 7.567l4.793 3.05 7.96-8.3Z"/>
                    </svg>
                </button>
            </div>

            <!-- Quick Action Chips -->
            <div class="quick-actions" role="group" aria-label="Quick actions">
                <button class="action-chip" data-cmd="Turn off the lights" id="chip-lights-off">TURN OFF LIGHTS</button>
                <button class="action-chip" data-cmd="Turn on the TV" id="chip-tv-on">TURN ON TV</button>
                <button class="action-chip" data-cmd="Lock the door" id="chip-lock-door">LOCK DOOR</button>
                <button class="action-chip" data-cmd="Close the curtains" id="chip-curtains">CLOSE CURTAINS</button>
            </div>
        </div>
    </main>

    <script src="/app.js"></script>
</body>
</html>
